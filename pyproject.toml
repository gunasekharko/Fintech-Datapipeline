[project]
name='fintech-data-platform'
version='0.1.0'
requires-python= ">=3.11"
dependencies=[
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    "tenacity>=9.1.4",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]


[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_return_any = true
strict = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]
